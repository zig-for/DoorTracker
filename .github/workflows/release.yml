name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The door randomizer: the exe ships some of its files
          submodules: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --with pyinstaller pyinstaller DoorsTracker.spec
      - run: gh release create $env:GITHUB_REF_NAME dist/JankerTracker.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
